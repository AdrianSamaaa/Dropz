<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Drop</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="drop.css">
</head>
<body>
  <div class="card" id="card">
    <header class="head" id="head">
      <div class="glyph" id="glyph"></div>
      <div class="titles">
        <div class="name" id="name"></div>
        <input class="name-input" id="nameInput" maxlength="40" spellcheck="false" hidden>
        <div class="meta" id="meta"></div>
      </div>
      <button class="icon-btn pin" id="pinBtn" title="Pin open">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 3 3H7l3-3z"/><path d="M12 16v5"/></svg>
      </button>
      <span class="chev" aria-hidden="true">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </header>
    <div class="body" id="body">
      <div class="inner" id="inner">
        <ul class="list" id="list"></ul>
        <div class="empty" id="empty" hidden>
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11"/><path d="M7.5 9.5 12 14l4.5-4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          <span>Drag apps from your desktop<br>and drop them here</span>
        </div>
        <button class="add" id="addBtn">
          <svg viewBox="0 0 16 16" width="13" height="13"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Add apps
        </button>
      </div>
    </div>
  </div>
  <script src="drop.js"></script>
</body>
</html>
